[package]
name = "pamoja"
version = "0.1.0"
description = "Pamoja: pay-when-done service escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pamoja"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
