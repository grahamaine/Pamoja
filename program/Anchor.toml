[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

# Same address on both clusters. The devnet deployment is the one the live demo uses.
[programs.localnet]
pamoja = "9dLzUWtKppSVHsBBAAea7nqhWUy2pzY3E19PrnGdP2Q4"

[programs.devnet]
pamoja = "9dLzUWtKppSVHsBBAAea7nqhWUy2pzY3E19PrnGdP2Q4"

[provider]
# `anchor test` runs against a local validator. Deploy with:
#   anchor deploy --provider.cluster devnet
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
